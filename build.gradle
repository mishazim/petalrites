plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = '1.0.0'
group = 'com.petalrites'
base { archivesName = 'petalrites' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client { }
    server { programArgument '--nogui' }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.172"
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'petalrites',
            'Specification-Vendor'    : 'petalrites',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'petalrites',
        ])
    }
}
